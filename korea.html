<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Korea</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
  }
  .kframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    z-index: 1;
  }
  .kframe.visible { opacity: 1; }
  .kframe img {
    display: block;
    max-width: 70vw;
    max-height: 70vh;
    width: auto;
    height: auto;
  }
  #frame0 { z-index: 4; transition: opacity 3s ease; }
  #frame4 { z-index: 1; transition: opacity 1.5s ease; }
  #frame1 { z-index: 2; transition: opacity 1.5s ease; }
  #frame2 { z-index: 5; transition: opacity 3s ease; }

  .spin {
    animation: spin 14s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes csspulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .css-pulse { animation: csspulse 1.1s ease-in-out infinite; }
</style>
</head>
<body>
<div class="stage">
  <div class="kframe" id="frame0"><img src="assets/kim0.png" alt=""></div>
  <div class="kframe" id="frame4"><div class="spin"><div class="css-pulse"><img id="kim4img" src="assets/kim4.png" alt=""></div></div></div>
  <div class="kframe" id="frame1"><div class="css-pulse"><img id="kim1img" src="assets/kim1.png" alt=""></div></div>
  <div class="kframe" id="frame2"><img src="assets/kim2.png" alt=""></div>
</div>

<script>
  (function(){
    var frame0 = document.getElementById('frame0');
    var frame1 = document.getElementById('frame1');
    var frame4 = document.getElementById('frame4');
    var frame2 = document.getElementById('frame2');
    var kim1img = document.getElementById('kim1img');
    var kim4img = document.getElementById('kim4img');

    // this page is meant to be embedded as an iframe in index.html, which owns
    // the actual <audio> element and player controls - we just read its
    // playback position to drive the image sequence
    var audio;
    try {
      audio = window.parent.document.getElementById('bgm');
    } catch (e) {
      audio = null;
    }
    if (!audio) return;

    var kim1Triggered = false;
    var kim2Triggered = false;
    var pulseStarted = false;

    // the wrapping .css-pulse divs run a constant metronomic scale animation;
    // on top of that we layer a real audio-reactive scale on the images
    // themselves - kim4 (background) tracks bass, kim1 (foreground) tracks
    // treble, each pulled from the analyser index.html sets up on the real
    // <audio> element. If that's unreachable (e.g. cross-origin embedding),
    // the images just sit at scale(1) and the metronomic pulse carries alone.
    var kim4Scale = 1;
    var kim1Scale = 1;
    function levelPulse(){
      var bassLevel = 0, trebleLevel = 0;
      try {
        if (typeof window.parent.getKoreaAudioLevel === 'function') {
          bassLevel = window.parent.getKoreaAudioLevel('bass') || 0;
          trebleLevel = window.parent.getKoreaAudioLevel('treble') || 0;
        }
      } catch (e) {
        bassLevel = 0;
        trebleLevel = 0;
      }

      var target4 = 1 + bassLevel * 0.6;
      var target1 = 1 + trebleLevel * 0.6;
      // fast attack, slower decay - snaps up on a hit, eases back down
      // instead of chasing every noisy frame-to-frame reading
      kim4Scale += (target4 - kim4Scale) * (target4 > kim4Scale ? 0.5 : 0.15);
      kim1Scale += (target1 - kim1Scale) * (target1 > kim1Scale ? 0.5 : 0.15);
      kim4img.style.transform = 'scale(' + kim4Scale.toFixed(3) + ')';
      kim1img.style.transform = 'scale(' + kim1Scale.toFixed(3) + ')';
      requestAnimationFrame(levelPulse);
    }

    function showKim1(){
      frame0.classList.remove('visible');
      frame1.classList.add('visible');
      frame4.classList.add('visible');
      if (!pulseStarted) {
        pulseStarted = true;
        levelPulse();
      }
    }

    function showKim2(){
      frame1.classList.remove('visible');
      frame4.classList.remove('visible');
      frame2.classList.add('visible');
    }

    function sync(){
      var t = audio.currentTime;
      var d = audio.duration;
      if (!kim2Triggered && d && (d - t) <= 3) {
        kim1Triggered = true;
        kim2Triggered = true;
        showKim2();
      } else if (!kim1Triggered && t >= 3) {
        kim1Triggered = true;
        showKim1();
      } else if (!kim1Triggered) {
        frame0.classList.add('visible');
      }
    }

    audio.addEventListener('timeupdate', sync);
    sync();
  })();
</script>
</body>
</html>
